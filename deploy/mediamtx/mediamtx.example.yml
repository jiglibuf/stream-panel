# Пример приёмного хаба RedZone на MediaMTX.
#
# Зачем хаб: друзья отдают сюда картинку своих окон Dota, а OBS владельца берёт
# её с localhost. Каждый поток — 2–6 Мбит/с и доли секунды задержки; по сети
# (NDI) на это ушло бы 100–200 Мбит/с на поток, а с Twitch картинка идёт с
# задержкой в несколько секунд — для совместного каста это много.
#
# Главное здесь — разграничение доступа:
#   * program — готовый эфир. Публикует в него только OBS владельца с localhost.
#     Стоит overridePublisher: false, чтобы чужой (в том числе тестовый)
#     публикатор не выбил OBS и не подменил картинку в прямом эфире.
#   * card1..cardN — карты друзей. У каждой карты свой ключ, и он работает ровно
#     на свою карту: перепутать номер нельзя, хаб просто откажет.
#   * ключ зрителя даёт чтение ТОЛЬКО пути program: друзья видят общий эфир, но
#     не карты друг друга.
#
# Все ключи ниже — заглушки. Перед запуском положите рядом копию этого файла под
# именем mediamtx.yml и замените каждое `<...>` на своё случайное значение
# (например: openssl rand -base64 24). Ключи не попадают ни в репозиторий, ни в
# переписку, ни в журнал контейнера.
#
# Полный список настроек — mediamtx.yml в репозитории bluenviron/mediamtx;
# здесь только то, что отличается от значений по умолчанию.

logLevel: info
logDestinations: [stdout]

# API нужен, чтобы смотреть «кто сейчас шлёт» и состояние путей; опрашивается
# только с localhost (см. authInternalUsers).
api: true
apiAddress: :9997
# MoQ не используется, а при старте генерирует себе сертификат — выключен.
moq: false

pathDefaults:
  # ВАЖНО: по умолчанию здесь true — «новый публикатор выбивает текущего».
  # С двумя друзьями на одной карте это выглядело как «у обоих упало
  # подключение»: они выкидывали друг друга по кругу каждые несколько секунд.
  # С false второй получает отказ, а работающий продолжает отдавать картинку.
  overridePublisher: false

# Кто что может. Локальный OBS читает и публикует без пароля — но только с этой
# же машины; всё остальное (в том числе адрес в tailnet) — по ключу.
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

  # Общий ключ публикации: годится на любую карту. Удобен для проверок; каждому
  # другу на боевом хабе лучше выдать его собственный ключ (ниже).
  - user: rz
    pass: <общий-ключ-публикации>
    ips: []
    permissions:
      # Только карты: в program публикует OBS владельца, снаружи не должен никто.
      - action: publish
        path: ~^card[0-9]+$

  # По одной записи на каждую карту: своё имя пользователя и свой ключ.
  # Имя карты в ссылке должно совпадать с path, иначе хаб откажет.
  - user: rz-card2
    pass: <ключ-карты-2>
    ips: []
    permissions:
      - action: publish
        path: card2

  - user: rz-card3
    pass: <ключ-карты-3>
    ips: []
    permissions:
      - action: publish
        path: card3

  - user: rz-card4
    pass: <ключ-карты-4>
    ips: []
    permissions:
      - action: publish
        path: card4
  # ...и так далее до cardN: по одной такой записи на каждую карту.

  # Ключ зрителя: только чтение и только пути program. Карты друг друга зрителям
  # недоступны — обращение к cardN с их ключом даёт 401.
  - user: viewer
    pass: <ключ-зрителя>
    ips: []
    permissions:
      - action: read
        path: program

# Пути создаются на лету, отдельно описывать cardN не нужно.
paths:
  all_others:

  # Готовый эфир: сюда публикует OBS владельца, отсюда читают зрители, а релей
  # копирует поток в Twitch без перекодирования.
  program:
    overridePublisher: false
