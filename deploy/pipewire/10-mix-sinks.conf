# Виртуальные выходы-миксы для стрима (пример).
#
# Куда положить: ~/.config/pipewire/pipewire-pulse.conf.d/10-mix-sinks.conf
# (каталог можно не создавать заранее — создайте его при копировании).
#
# Зачем три выхода, а не один:
#   game_mix    — звук игры;  его монитор читает источник OBS «Звук системы»;
#   discord_mix — голоса (Discord);  его монитор читает источник OBS «Дискорд»;
#   rz_mix      — всё остальное (браузер и пр.). Он же — выход по умолчанию,
#                 и в эфир сам по себе не идёт.
# Разделение нужно, чтобы фокус на чужой карте глушил только игру, но не
# комментарии друзей из Discord.
#
# Эти выходы создаются при старте pipewire-pulse, то есть после перезагрузки или
# перезапуска PipeWire поднимаются сами. Петли из их мониторов в наушники здесь
# не описаны намеренно: после переподключения наушников связь петли рвётся, и
# чинит её сторож звука (rz-mix.service) — он же держит rz_mix выходом по
# умолчанию. Если сторож не запущен, миксы будут, а звука в наушниках — нет.
#
# Имена выходов должны совпадать с теми, что ищет сторож (см. rz_mix_watch.py).

pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=game_mix sink_properties=device.description=RZ_Game" }
    { cmd = "load-module" args = "module-null-sink sink_name=discord_mix sink_properties=device.description=RZ_Discord" }
    { cmd = "load-module" args = "module-null-sink sink_name=rz_mix sink_properties=device.description=RZ_Mix" }
]
