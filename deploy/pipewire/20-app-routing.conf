# Маршрутизация звука по приложениям (пример, декларативный вариант).
#
# Куда положить: ~/.config/pipewire/pipewire.conf.d/20-app-routing.conf
#
# Что делает: при появлении потока PipeWire сам направляет его на нужный
# виртуальный выход из 10-mix-sinks.conf:
#   игра (media.role=game)      -> game_mix;
#   процессы dota2              -> game_mix;
#   Discord (WebRTC VoiceEngine)-> discord_mix;
#   всё остальное               -> выход по умолчанию (rz_mix).
#
# Как это работает: node.rules срабатывают каждый раз, когда у узла задаются или
# меняются свойства. update-props задаёт потоку target.object — имя выходного
# узла, к которому его надо подключить. Значения ключей сверяются как «всё
# совпало»; `~` в начале значения означает регулярное выражение.
#
# ВАЖНО, почему одного этого файла мало. Декларативные правила хорошо работают,
# когда выход на месте с самого начала. Но стоит наушникам отключиться и
# подключиться заново (или PipeWire перезапуститься) — уже играющий поток
# остаётся привязанным к исчезнувшему устройству, и звук пропадает, хотя снаружи
# выглядит рабочим. Лечится это не конфигом, а службой-сторожем (rz-mix.service):
# она перепроверяет связи раз в несколько секунд и восстанавливает их. Здесь же
# остаётся «первый проход» — чтобы новому приложению не приходилось ждать
# сторожа. Если сторож работает, этот файл можно и не ставить.
#
# Имена выходов (game_mix, discord_mix, rz_mix) должны совпадать с
# 10-mix-sinks.conf и со сторожем. Имя процесса игры/клиента может отличаться на
# другой машине — проверьте `pactl list sink-inputs` и поправьте шаблоны.

node.rules = [
    {
        # Звук игры: сам клиент помечает свой поток media.role=game.
        matches = [
            { media.role = "game" }
        ]
        actions = {
            update-props = {
                target.object = "game_mix"
            }
        }
    }
    {
        # Запасной вариант, если игра не выставила media.role.
        matches = [
            { application.process.binary = "~(?i)dota2" }
        ]
        actions = {
            update-props = {
                target.object = "game_mix"
            }
        }
    }
    {
        # Голоса: у Discord поток создаёт WebRTC VoiceEngine, отдельного имени
        # приложения может не быть — ловим по обоим признакам.
        matches = [
            { application.name = "~(?i)discord" }
            { application.name = "~(?i)webrtc" }
        ]
        actions = {
            update-props = {
                target.object = "discord_mix"
            }
        }
    }
    # Остальные приложения не трогаем: они идут на выход по умолчанию (rz_mix),
    # который сторож назначает сам.
]
