<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пульт стрима">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
<title>Пульт стрима</title>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span class="live" id="live">нет связи</span>
    </div>
    <div class="badges">
      <span class="badge rec" id="recBadge">● ЗАПИСЬ</span>
      <span class="badge" id="obsBadge">OBS</span>
    </div>
  </header>

  <section class="block">
    <h2>Сцены <span class="hint">как на цифровом блоке</span></h2>
    <div class="grid scenes" id="scenes"></div>
  </section>

  <section class="block">
    <h2>Эфир</h2>
    <div class="transport">
      <button class="btn big" id="btnStream">Начать эфир</button>
      <button class="btn" id="btnRecord"><span class="rdot"></span> Запись</button>
      <button class="btn" id="btnReplay">Сохранить повтор</button>
    </div>
  </section>

  <section class="block">
    <h2>Звук</h2>
    <div class="audio">
      <div class="arow">
        <button class="btn mute" data-mute="mic">Микрофон</button>
        <input type="range" min="0" max="100" step="1" data-vol="mic" aria-label="Громкость микрофона">
        <span class="val" data-val="mic">100</span>
      </div>
      <div class="arow">
        <button class="btn mute" data-mute="sys">Система</button>
        <input type="range" min="0" max="100" step="1" data-vol="sys" aria-label="Громкость системы">
        <span class="val" data-val="sys">100</span>
      </div>
    </div>
  </section>

  <section class="block">
    <h2>Звуковая панель
      <span class="hint"><label class="upload">＋ загрузить<input type="file" id="upload" accept="audio/*" multiple hidden></label></span>
    </h2>
    <div class="snds-head">
      <button class="btn small" id="btnStopSounds">⏹ стоп всё</button>
      <input type="range" min="0" max="100" step="1" id="sndvol" aria-label="Громкость дорожек">
      <span class="val" id="sndvolVal">90</span>
    </div>
    <div class="sounds" id="sounds"></div>
  </section>

  <p class="foot">Кидай mp3/wav/ogg в <code>~/obs-panel/sounds/</code> — появятся здесь. Дорожки играют на ПК, поэтому зрители их слышат.</p>
</div>
<script src="/static/app.js"></script>
</body>
</html>
